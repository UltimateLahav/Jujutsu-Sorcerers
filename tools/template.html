<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0a17">
<title>Jujutsu Sorcerers</title>
<style>
/* Press Start 2P, SIL Open Font License 1.1, embedded so the game works offline */
@font-face{font-family:"Press Start 2P";src:url(data:font/woff2;base64,__FONT__) format("woff2");font-display:block}
:root{--bg:#0d0a17;--ink:#f4f2f8;--dim:#8f86b0;--acc:#8f7ac4;--card:#1a1330;--line:#6d56a0;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;font-family:"Press Start 2P",ui-monospace,monospace}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#game{position:fixed;left:0;top:0;display:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);text-align:center;background:radial-gradient(ellipse at 50% 30%,#2a1a4d,var(--bg) 70%)}
.screen.on{display:flex}
h1{margin:0;font-size:clamp(14px,8vh,44px);line-height:1.3;text-shadow:0 0 14px var(--acc),3px 3px 0 #000}
h2{margin:0;font-size:clamp(10px,4vh,22px);text-shadow:3px 3px 0 #000}
small{color:var(--dim);font-size:clamp(7px,2vh,11px)}
button{font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);padding:1.6vh 2.4vh;cursor:pointer;font-size:clamp(9px,3vh,16px);box-shadow:4px 4px 0 #000}
button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
#title{flex-direction:row;gap:6vh}
.tcol{display:flex;flex-direction:column;align-items:center;gap:3vh}
#hero{width:min(68vh,40vw);height:auto;aspect-ratio:1;filter:drop-shadow(0 0 2vh rgba(90,180,255,.55));animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 4.5vh rgba(120,200,255,.95))}}
.blink{animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:.4}}
.cards{display:flex;gap:2.5vh}
.card{width:24vh;height:40vh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:1.5vh;font-size:clamp(8px,2.4vh,13px)}
.card canvas{height:24vh;width:auto}
.card i{color:var(--dim);font-style:normal;font-size:.8em}
#gojo{border-color:var(--acc)}
#gojo:hover,#gojo:focus-visible{background:#2a1f4a;outline:none}
.lock{opacity:.45;border:3px dashed var(--line);background:#120d22}
.lock span{font-size:8vh;margin-top:6vh}
#hud{position:fixed;left:calc(env(safe-area-inset-left) + 10px);top:calc(env(safe-area-inset-top) + 10px);display:none;align-items:center;gap:12px;font-size:clamp(8px,2.6vh,13px);text-shadow:2px 2px 0 #000}
#hud button{padding:1vh 1.6vh;font-size:inherit}
#pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 calc(env(safe-area-inset-right) + 3vh) calc(env(safe-area-inset-bottom) + 3vh) calc(env(safe-area-inset-left) + 3vh);pointer-events:none}
.pb{pointer-events:auto;touch-action:none;width:15vh;height:15vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6vh;padding:0;font-size:clamp(10px,5vh,24px);opacity:.78}
.pb span{font-size:clamp(5px,1.7vh,9px);color:var(--dim)}
.pb.on{background:#2a1f4a;border-color:var(--acc);opacity:1}
.col{display:grid;grid-template-columns:auto auto;gap:1.6vh;align-items:end;justify-items:end}      /* BLOCK BLUE / DASH ATTACK */
#lap{border-color:#59b8ff}
#dash{border-color:#7bd9a3}
#blk{border-color:#9f8cff}
#lap svg,#dash svg,#blk svg,#atk svg{width:4.5vh;height:4.5vh}
#atk{border-color:#6fb4ff;width:17vh;height:17vh}
#settings.screen{z-index:5;background:rgba(13,10,23,.95);gap:2vh}
#vols{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 5vh;width:min(92vw,820px);text-align:left}
#vols label{display:grid;grid-template-columns:1fr auto;gap:.8vh 1vh;font-size:clamp(7px,2.2vh,12px)}
#vols input{grid-column:1/3;width:100%;height:3.4vh;accent-color:var(--acc)}
#vols b{font-weight:normal;color:var(--acc)}
.row{display:flex;gap:2.4vh;flex-wrap:wrap;justify-content:center}
#joy{pointer-events:auto;touch-action:none;position:relative;width:40vh;height:40vh;flex:none}      /* the joystick: left / right walk, up jumps, down crouches */
#joy .jb{position:absolute;inset:0;width:100%;height:100%;opacity:.85}
#joy .jbase{fill:#1a1330;stroke:#6d56a0;stroke-width:3}
#joy .jarr{fill:#8f86b0}
#knob{position:absolute;left:50%;top:50%;width:15vh;height:15vh;margin:-7.5vh 0 0 -7.5vh;transform:translate(var(--kx,0px),var(--ky,0px));filter:drop-shadow(3px 3px 0 #000)}
#knob path{fill:#2a1f4a;stroke:#8f7ac4;stroke-width:2}
#joy.on .jbase{stroke:#8f7ac4}
#joy.on #knob path{fill:#3d2f6e;stroke:#b9a8ee}
#rotate{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);text-align:center;line-height:1.6;font-size:12px}
#rotate div{font-size:56px;animation:r 2s ease-in-out infinite}
@keyframes r{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<section id="title" class="screen on">
  <canvas id="hero" width="64" height="64" role="img" aria-label="Gojo lifting his blindfold, one eye glowing"></canvas>
  <div class="tcol">
    <h1>JUJUTSU<br>SORCERERS</h1>
    <button id="start" class="blink">TAP TO START</button>
    <small>BEST PLAYED IN LANDSCAPE</small>
  </div>
</section>

<section id="select" class="screen">
  <h2>CHOOSE YOUR SORCERER</h2>
  <div class="cards">
    <button id="gojo" class="card"><canvas id="pv"></canvas><b>GOJO</b><i>STRONGEST</i></button>
    <div class="card lock"><span>?</span><b>LOCKED</b></div>
    <div class="card lock"><span>?</span><b>LOCKED</b></div>
  </div>
</section>

<section id="settings" class="screen">
  <h2>SETTINGS</h2>
  <small>VOLUME OF EACH SOUND (100% = DEFAULT, UP TO 200%)</small>
  <div id="vols"></div>
  <div class="row"><button id="dummyBtn">SPAWN DUMMY</button><button id="fighterBtn">SPAWN ATTACKER</button><button id="blockerBtn">SPAWN BLOCKER</button><button id="setClose">CLOSE</button></div>
</section>

<div id="hud"><button id="back">&lt; MENU</button><span>GOJO SATORU</span><button id="snd">SND ON</button><button id="setBtn">SET</button></div>
<div id="pad">
  <div id="joy" role="application" aria-label="Joystick: push left or right to walk, up to jump, down to crouch">
    <svg class="jb" viewBox="0 0 84 84" shape-rendering="crispEdges" aria-hidden="true">
      <path class="jbase" d="M30 6h24l24 24v24L54 78H30L6 54V30z"/>
      <path class="jarr" d="M42 12l7 9H35zM42 72l7-9H35zM12 42l9-7v14zM72 42l-9-7v14z"/>
    </svg>
    <svg id="knob" viewBox="0 0 32 32" shape-rendering="crispEdges" aria-hidden="true"><path d="M10 2h12l8 8v12l-8 8H10l-8-8V10z"/></svg>
  </div>
  <div class="col">
    <button id="blk" class="pb" aria-label="Block (hold)"><svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M0 0h8v4H7v1H6v1H5v1H4v1H3V7H2V6H1V5H0z"/></svg><span>BLOCK</span></button>
    <button id="lap" class="pb" aria-label="Lapse Blue"><svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M2 1h4v1h1v4h-1v1h-4v-1h-1v-4h1z"/></svg><span>BLUE</span></button>
    <button id="dash" class="pb" aria-label="Dash"><svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M0 1h2l3 3-3 3H0l3-3zM4 1h2l2 3-2 3H4l3-3z"/></svg><span>DASH</span></button>
    <button id="atk" class="pb" aria-label="Attack"><svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M3 0h2v8H3zM0 3h8v2H0zM1 1h1v1H1zM6 1h1v1H6zM1 6h1v1H1zM6 6h1v1H6z"/></svg><span id="atkl">R.HOOK</span></button>
  </div>
</div>
<div id="rotate"><div>&#128241;</div>ROTATE YOUR PHONE<br>TO LANDSCAPE</div>

<script>
(() => {
'use strict';
__SFX__
const D = __SPR__;                 // palette + idle / walk-forward / walk-back / jump / double-jump (teleport) sprite frames (rows of palette letters)
const HEROES = __HEROES__;         // title key art: 0 eye open ... 4 eye fully closed
const IDLE_FPS = 12, WALK_FPS = 15, JUMP_FPS = 15, TELE_FPS = 20;   // animation speeds in frames per second (15 walk frames = 1 s per cycle = one step every half second; 15 jump frames = 1 s; 15 teleport frames = 0.75 s)
const ATK_FPS = [30, 30, 30, 24, 24, 24, 30, 30], ATK_IMPACT = [7, 7, 7, 8, 8, 6, 6, 7], ATK_SWING = [4, 4, 4, 5, 0, 0, 3, 3], COMBO_MS = 1400, MB_FPS = 20, ORB_MS = 3400, DASH_FPS = 30, DASH_FWD = 50, DASH_BACK = 42, BLK_FPS = 24;   // 15 frames per attack; the next press within COMBO_MS continues the combo. Index 4 and 5 are Lapse Blue (not combo hits), 6 and 7 are the crouch punches; Max Blue: 40 summon frames at 20 FPS, the orb lives 3.4 s
const ATK_NAMES = ['R.HOOK', 'L.HOOK', 'ELBOW', 'KICK'], CR_FPS = 24, LAPSE_FPS = 24;   // hooks and the elbow nudge the enemy (so the combo keeps connecting); the kick sends him sliding with a smoke trail
const DUMMY_HP = 300, RX_FPS = [16, 16, 16, 18, 12, 16, 16, 16, 12, 14], RX_DUR = RX_FPS.map(f => 10000 / f);      // 10 reactions, 10 frames each
const REACH = [17, 17, 15, 26, 0, 0, 16, 16], KNOCK = [9, 9, 11, 100, 0, 0, 8, 8], KNOCK_G = [26, 26, 34, 80, 0, 0, 20, 20], DMG = [12, 14, 18, 35, 0, 0, 10, 13];   // per hit: how far it reaches from his hips (px), how hard it shoves the dummy (px/s), damage number
const FWD_SPEED = 44, BACK_SPEED = 30;         // world pixels per second (matched to the slower stride so his feet do not skate)
const BLINK_STEP = 70, BLINK_HOLD = 500;       // ms per blink frame, ms the eye stays shut
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const pv = $('pv'), pctx = pv.getContext('2d');
const hero = $('hero'), hctx = hero.getContext('2d');

// turn a sprite set's text rows into tiny offscreen canvases
const rgbOf = h => (0xff000000 | (parseInt(h.substr(5, 2), 16) << 16) | (parseInt(h.substr(3, 2), 16) << 8) | parseInt(h.substr(1, 2), 16)) >>> 0;   // ABGR, as a little-endian Uint32 sees RGBA bytes
const mk = (set, pal = D.pal) => {
  const cols = {}; for (const k in pal) cols[k] = rgbOf(pal[k]);
  return set.frames.map(rows => {
    const c = document.createElement('canvas'); c.width = set.w; c.height = set.h;
    const g = c.getContext('2d'), im = g.createImageData(set.w, set.h), px = new Uint32Array(im.data.buffer);
    rows.forEach((row, y) => { for (let x = 0; x < row.length; x++) { const ch = row[x]; if (ch !== '.') px[y * set.w + x] = cols[ch]; } });
    g.putImageData(im, 0, 0); return c;
  });
};
const idleF = mk(D.idle), fwdF = mk(D.fwd), backF = mk(D.back), jumpF = mk(D.jump), teleF = mk(D.tele), atkF = [0, 1, 2, 3].map(k => mk(D['atk' + k]));
const crF = { dn: mk(D.cdn), idle: mk(D.cidle), fwd: mk(D.cfwd), back: mk(D.cback), jump: mk(D.cjump) }, lapseF = [4, 5].map(k => mk(D['atk' + k]));
const mbF = mk(D.atk8), orbF = mk(D.orb); atkF[6] = mk(D.atk6); atkF[7] = mk(D.atk7); atkF[9] = mk(D.atk9); atkF[10] = mk(D.atk10); atkF[11] = mk(D.atk11);      // atk11 = the guard (10 frames)      // atk9 = dash forward, atk10 = dash back (15 frames each)      // crouch (down, idle, walks, spring jump), Lapse Blue (pull, blink), crouch punches, the Max Blue summon (40 frames) and the orb (20-frame loop)
const inv = h => '#' + [1, 3, 5].map(i => (255 - parseInt(h.substr(i, 2), 16)).toString(16).padStart(2, '0')).join('');
const invPal = {}, whitePal = {};
const bluePal = {};                           // the stunned look: recoloured in blues by brightness
for (const k in D.pal) { const h = D.pal[k], l = parseInt(h.substr(1, 2), 16) + parseInt(h.substr(3, 2), 16) + parseInt(h.substr(5, 2), 16); invPal[k] = inv(h); whitePal[k] = '#ffffff'; bluePal[k] = l >= 520 ? '#ffffff' : l >= 300 ? '#c8f2ff' : l >= 150 ? '#59b8ff' : '#2060d8'; }
const dumF = mk(D.idle, invPal), dumW = mk(D.idle, whitePal), dumB = mk(D.idle, bluePal);      // the training dummy: Gojo with inverted colours
const rxN = [], rxI = [], rxW = [];                                 // 10 hit reactions x 10 frames: normal colours (Gojo), inverted (dummy), white silhouette (hit flash)
for (let k = 0; k < 10; k++) { rxN.push(mk(D['rx' + k])); rxI.push(mk(D['rx' + k], invPal)); rxW.push(mk(D['rx' + k], whitePal)); }
const blkI = mk(D.atk11, invPal);                                  // the blocking dummy: the guard pose in inverted colours
const dumWalk = mk(D.fwd, invPal), atkI = [0, 1, 2, 3].map(k => mk(D['atk' + k], invPal));      // the attacking dummy walks and swings in inverted colours too
pv.width = D.idle.w; pv.height = D.idle.h;
const heroImgs = HEROES.map(src => { const im = new Image(); im.src = src; return im; });

let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

let state = 'title', S = 1, VW = 320, VH = 128, gy = 100, bg = null, far = null, near = null;
let spawnAt = 0, last = 0, parts = [], wx = 0, mode = 'idle', modeAt = 0, stepN = -1, evJ = -1, evT = -1;
let keyL = false, keyR = false, padL = false, padR = false, jumpReq = false, jumpAt = -1, teleAt = -1, teleL0 = 0, atkReq = false, atkAt = -1, atkK = 0, combo = 0, comboUntil = 0, atkQ = false, evA = -1, shakeUntil = 0, shakeAmp = 0, dummy = null, popups = [], hits = { n: 0, dmg: 0, until: 0, seq: 0, perfect: -9999 }, kos = 0, hurtAt = -1, hurtK = 0, hurtEnd = -9999, wxv = 0, gojoLift = 0, gojoGone = false, stance = 'stand', stAt = 0, crReq = false, jumpC = false, lpReq = false, lpAt = -1, lpK = 0, lpReady = 0, dash = null, smoke = [], evL = -1, evM = -1, mbAt = -1, mbPending = false, orb = null, debris = [], cpIdx = 0, lastLabel = '', flashUntil = 0, flashMs = 1, flashA = 0, stickX = 0, stickY = 0, stickUp = false, stickDown = false, stickCr = false, stickDownEnd = -9999, jumpFromStick = false, joyId = null, dashReq = false, dgAt = -1, dgK = 0, dgFrom = 0, dgTo = 0, dgAir = false, dgUsed = false, dgReady = 0, blockHeld = false, blkAt = -1, blkEnd = -1, blkFrom = 4;
const STRIP = 480;

// ---------------------------------------------------------------- sound (all synthesised in sfx.js, no audio files)
let sfx = null, soundOn = true;
try { soundOn = localStorage.getItem('js_snd') !== '0'; } catch (e) { /* storage blocked: stay on */ }
function audio() {                            // browsers only allow sound after a tap, so this is first called from the TAP TO START button
  if (!sfx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { sfx = makeSfx(new AC()); } catch (e) { sfx = null; return null; }
    sfx.setOn(soundOn); applyVols();
    if (state === 'play') sfx.windOn();
  }
  if (sfx.ac.state === 'suspended' && !document.hidden) sfx.ac.resume();
  return sfx;
}
function snd(name, a, b) {                    // play one cue (and log it when a test harness asks for that)
  if (window.__sfxlog) window.__sfxlog.push([name, Math.round(performance.now()), a, b]);
  if (sfx && soundOn && sfx.ac.state === 'running') {
    try { sfx[name.split(':').pop()](a, b); }     // 'f:hit' = the attacking dummy's hit (same sound, own log name)
    catch (e) { if (window.__sfxlog) console.error('sound ' + name + ': ' + e); }     // a sound problem must never stop the game; the tests still report it
  }
}
window.__audio = on => { if (!sfx) return; if (on) audio(); else sfx.ac.suspend(); };   // called by the Android app when it goes to / comes back from the background

// ---------------------------------------------------------------- settings: a volume slider for every sound
const VOLS = [['master', 'MASTER'], ['steps', 'FOOTSTEPS'], ['wind', 'WIND'], ['jump', 'JUMP + LANDING'], ['tele', 'TELE + BLUE'], ['atk', 'ATTACKS']];
const vol = { master: 100, steps: 100, wind: 100, jump: 100, tele: 100, atk: 100 };
try { Object.assign(vol, JSON.parse(localStorage.getItem('js_vol') || '{}')); } catch (e) { /* storage blocked: defaults */ }
function applyVols() { if (sfx) for (const [k] of VOLS) sfx.setVol(k, vol[k] / 100); }
function preview(k) {                         // let go of a slider and you hear that sound (the wind is already playing underneath)
  if (!audio() || k === 'wind') return;
  if (k === 'jump') { sfx.jump(); setTimeout(() => sfx.land(1), 380); }
  else if (k === 'tele') { sfx.vanish(); setTimeout(() => sfx.arrive(), 120); }
  else if (k === 'atk') { sfx.swing(0); setTimeout(() => { sfx.hit(0); sfx.smack(0); }, 140); }
  else { sfx.step(0, false); setTimeout(() => sfx.step(1, false), 500); }
}

// ---------------------------------------------------------------- title blink
let heroShown = -1, blinkSeq = [], blinkIdx = 0, blinkAt = 0;
function planBlink(now, openFor) {           // open -> 1 -> 2 -> 3 -> 4 (closed, held) -> 3 -> 2 -> 1 -> open
  blinkSeq = [[0, openFor], [1, BLINK_STEP], [2, BLINK_STEP], [3, BLINK_STEP], [4, BLINK_HOLD], [3, BLINK_STEP], [2, BLINK_STEP], [1, BLINK_STEP]];
  blinkIdx = 0; blinkAt = now;
}
function updateBlink(now) {
  while (now - blinkAt >= blinkSeq[blinkIdx][1]) {
    blinkAt += blinkSeq[blinkIdx][1];
    if (++blinkIdx >= blinkSeq.length) planBlink(blinkAt, 2200 + Math.random() * 2200);
  }
  return blinkSeq[blinkIdx][0];
}
function drawHero(i) {
  if (i === heroShown) return;
  const im = heroImgs[i];
  if (!im.complete || !im.naturalWidth) return;   // not decoded yet, retry next frame
  hctx.clearRect(0, 0, 64, 64); hctx.drawImage(im, 0, 0); heroShown = i;
}

// ---------------------------------------------------------------- screens
function show(s) {
  state = s;
  $('title').classList.toggle('on', s === 'title');
  $('select').classList.toggle('on', s === 'select');
  cv.style.display = s === 'play' ? 'block' : 'none';
  $('hud').style.display = s === 'play' ? 'flex' : 'none';
  $('pad').style.display = s === 'play' ? 'flex' : 'none';
  releaseAll(); $('settings').classList.remove('on');
  if (sfx) { if (s === 'play') sfx.windOn(); else sfx.windOff(); }
  if (s === 'play') { spawnAt = performance.now(); wx = 0; mode = 'idle'; modeAt = spawnAt; jumpAt = teleAt = atkAt = -1; atkQ = false; combo = 0; comboUntil = 0; dummy = null; popups = []; hits.n = hits.dmg = hits.until = hits.seq = 0; kos = 0; hurtAt = -1; wxv = 0; stance = 'stand'; stickCr = false; dgAt = -1; dgUsed = false; dashReq = false; blkAt = -1; blkEnd = -1; blockHeld = false; lpAt = -1; dash = null; smoke = []; mbAt = -1; mbPending = false; orb = null; debris = []; }
  if (s === 'title') planBlink(performance.now(), 1200);
}

// ---------------------------------------------------------------- world
// pixel-perfect sizing: whole device pixels per art pixel, ~128 art pixels tall
function resize() {
  const dpr = window.devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  S = Math.max(1, Math.floor(h * dpr / 128));
  VW = Math.ceil(w * dpr / S); VH = Math.ceil(h * dpr / S);
  cv.width = VW; cv.height = VH;
  cv.style.width = (VW * S / dpr) + 'px'; cv.style.height = (VH * S / dpr) + 'px';
  gy = Math.floor(VH * 0.78);
  buildBg();
  far = buildLayer('#2a1b45', 0.3, 26, 21);
  near = buildLayer('#1a1030', 0.2, 34, 33);
  seed = 3;
  parts = Array.from({ length: 30 }, () => ({ x: rnd() * VW, y: rnd() * gy, l: 3 + ((rnd() * 7) | 0), v: 40 + rnd() * 80 }));
}

function buildBg() {                          // static: sky, stars, moon, ground
  bg = document.createElement('canvas'); bg.width = VW; bg.height = VH;
  const g = bg.getContext('2d');
  const sky = ['#0e0a1f', '#171034', '#22184a', '#33205c', '#4a2a6a', '#6a3a74', '#8f4c78', '#b8647a'];
  const bh = Math.ceil(gy / sky.length);
  sky.forEach((c, i) => { g.fillStyle = c; g.fillRect(0, i * bh, VW, bh + 1); });
  seed = 11;
  for (let i = 0; i < 50; i++) { g.fillStyle = rnd() < 0.3 ? '#ffffff' : '#b9a8ee'; g.fillRect((rnd() * VW) | 0, (rnd() * gy * 0.55) | 0, 1, 1); }
  g.fillStyle = '#e9e4ff';

    pctx.drawImage(idleF[Math.floor(now / (1000 / IDLE_FPS)) % idleF.length], 0, 0);
  } else if (state === 'title') drawHero(updateBlink(now));
}

// ---------------------------------------------------------------- input
function releaseAll() {
  keyL = keyR = padL = padR = jumpReq = atkReq = crReq = lpReq = dashReq = blockHeld = false;
  $('atk').classList.remove('on'); $('lap').classList.remove('on'); $('dash').classList.remove('on'); $('blk').classList.remove('on'); joyRelease();
}
function bindPad(id, set) {                   // hold-to-walk touch buttons (multi-touch safe)
  const b = $(id);
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { b.setPointerCapture(e.pointerId); } catch (err) { /* older WebViews */ }
    set(true); b.classList.add('on');
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => b.addEventListener(t, () => { set(false); b.classList.remove('on'); }));
  b.addEventListener('contextmenu', e => e.preventDefault());
}
bindPad('atk', v => { if (v) atkReq = true; });
bindPad('dash', v => { if (v) dashReq = true; });
bindPad('blk', v => { blockHeld = v; });                    // hold to block           // tap to dash the way you are walking (back when standing still)
bindPad('lap', v => { if (v) lpReq = true; });           // tap for Lapse Blue (hold FWD while you tap it to pull the enemy in instead of blinking to him)
// THE JOYSTICK (bottom left): push left / right to walk back / forward, up to jump (one jump per push), down to crouch (he stays crouched while you hold it)
const joy = $('joy'), knob = $('knob');
function setStick(dx, dy) {
  const m = Math.hypot(dx, dy), v = m ? dy / m : 0;                                          // v = -1 straight up ... +1 straight down
  const up = m > (stickUp ? 0.3 : 0.55) && v < (stickUp ? -0.35 : -0.5), down = m > (stickDown ? 0.3 : 0.55) && v > (stickDown ? 0.35 : 0.5);      // up / down only when the stick points 30+ degrees above / below sideways, so a thumb that drifts a little while walking does not jump or crouch; the lower numbers are hysteresis so a finger on an edge does not flicker
  padL = dx < (padL ? -0.25 : -0.4); padR = dx > (padR ? 0.25 : 0.4);
  if (up && !stickUp) { jumpReq = true; jumpFromStick = true; }
  if (stickDown && !down) stickDownEnd = performance.now();
  stickX = dx; stickY = dy; stickUp = up; stickDown = down;
}
function joyMove(e) {
  const r = joy.getBoundingClientRect(), R = r.width * 0.3; let dx = (e.clientX - (r.left + r.width / 2)) / R, dy = (e.clientY - (r.top + r.height / 2)) / R; const m = Math.hypot(dx, dy);
  if (m > 1) { dx /= m; dy /= m; }
  knob.style.setProperty('--kx', (dx * R) + 'px'); knob.style.setProperty('--ky', (dy * R) + 'px'); setStick(dx, dy);
}
function joyRelease() { joyId = null; joy.classList.remove('on'); knob.style.setProperty('--kx', '0px'); knob.style.setProperty('--ky', '0px'); setStick(0, 0); }
joy.addEventListener('pointerdown', e => {
  e.preventDefault(); if (joyId !== null) return;
  joyId = e.pointerId; try { joy.setPointerCapture(e.pointerId); } catch (err) { /* older WebViews */ }
  joy.classList.add('on'); joyMove(e);
});
joy.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyMove(e); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => joy.addEventListener(n, e => { if (e.pointerId === joyId) joyRelease(); }));
joy.addEventListener('contextmenu', e => e.preventDefault());

const KEYS = { ArrowLeft: 'L', KeyA: 'L', ArrowRight: 'R', KeyD: 'R', ArrowUp: 'U', KeyW: 'U', Space: 'U', KeyJ: 'A', KeyF: 'A', ArrowDown: 'C', KeyS: 'C', KeyC: 'C', KeyL: 'B', KeyK: 'D', ShiftLeft: 'D', ShiftRight: 'D', KeyB: 'G' };
addEventListener('keydown', e => {
  if (settingsOn()) { if (e.key === 'Escape') closeSettings(); return; }      // the settings screen takes the keyboard while it is open
  const k = KEYS[e.code];
  if (k) {
    if (k === 'L') keyL = true; else if (k === 'R') keyR = true; else if (k === 'G') blockHeld = true; else if (state === 'play' && !e.repeat) { if (k === 'A') atkReq = true; else if (k === 'C') crReq = true; else if (k === 'B') lpReq = true; else if (k === 'D') dashReq = true; else { jumpReq = true; jumpFromStick = false; } }
    if (state === 'play') e.preventDefault();
    return;
  }
  if (e.key !== 'Escape') return;
  if (state === 'play') show('select'); else if (state === 'select') show('title');
});
addEventListener('keyup', e => {
  const k = KEYS[e.code];
  if (k === 'L') keyL = false; else if (k === 'R') keyR = false; else if (k === 'G') blockHeld = false;
});
addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) { releaseAll(); if (sfx) sfx.ac.suspend(); } else if (sfx) audio(); });
['pointerdown', 'keydown'].forEach(e => addEventListener(e, audio, true));   // any first tap or key also unlocks sound

function goFullscreen() {                     // best effort; ignored where unsupported (e.g. iPhone)
  try {
    const el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (f) { const p = f.call(el); if (p && p.catch) p.catch(() => {}); }
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
  } catch (e) { /* not available */ }
}
const inApp = /; wv\)/.test(navigator.userAgent);   // inside the Android app the activity already handles fullscreen + landscape
$('start').addEventListener('click', () => { audio(); if (!inApp && matchMedia('(pointer:coarse)').matches) goFullscreen(); show('select'); });
$('gojo').addEventListener('click', () => show('play'));
$('back').addEventListener('click', () => show('select'));
VOLS.forEach(([k, name]) => {
  const row = document.createElement('label');
  row.innerHTML = '<span>' + name + '</span><b></b><input type="range" min="0" max="200" step="5" aria-label="' + name + ' volume">';
  const inp = row.querySelector('input'), val = row.querySelector('b'); inp.value = vol[k]; val.textContent = vol[k] + '%';
  inp.addEventListener('input', () => {
    vol[k] = +inp.value; val.textContent = vol[k] + '%'; if (sfx) sfx.setVol(k, vol[k] / 100);
    if (window.__sfxlog) window.__sfxlog.push(['vol', Math.round(performance.now()), k, vol[k]]);
  });
  inp.addEventListener('change', () => { try { localStorage.setItem('js_vol', JSON.stringify(vol)); } catch (e) { /* storage blocked */ } preview(k); });
  $('vols').appendChild(row);
});
const settingsOn = () => $('settings').classList.contains('on');
const closeSettings = () => $('settings').classList.remove('on');
const dummyLabels = () => { $('dummyBtn').textContent = dummy && dummy.mode === 'dummy' ? 'REMOVE DUMMY' : 'SPAWN DUMMY'; $('fighterBtn').textContent = dummy && dummy.mode === 'fighter' ? 'REMOVE ATTACKER' : 'SPAWN ATTACKER'; $('blockerBtn').textContent = dummy && dummy.mode === 'blocker' ? 'REMOVE BLOCKER' : 'SPAWN BLOCKER'; };
$('setBtn').addEventListener('click', () => { releaseAll(); audio(); dummyLabels(); $('settings').classList.add('on'); });
$('setClose').addEventListener('click', closeSettings);
const toggleDummy = mode => { if (dummy && dummy.mode === mode) dummy = null; else spawnDummy(performance.now(), mode); closeSettings(); };
$('dummyBtn').addEventListener('click', () => toggleDummy('dummy'));      // a punching bag that reacts to every hit
$('fighterBtn').addEventListener('click', () => toggleDummy('fighter'));
$('blockerBtn').addEventListener('click', () => toggleDummy('blocker'));   // an inverted Gojo with his guard up: blocks normal punches and the pull from the front, not Max Blue, not hits from behind   // an inverted Gojo that walks up and attacks you
const sndLabel = () => { $('snd').textContent = soundOn ? 'SND ON' : 'SND OFF'; };
sndLabel();
$('snd').addEventListener('click', () => {    // mute / unmute (remembered)
  soundOn = !soundOn; audio(); if (sfx) sfx.setOn(soundOn);
  try { localStorage.setItem('js_snd', soundOn ? '1' : '0'); } catch (e) { /* storage blocked */ }
  sndLabel();
});
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 250));

window.__dummy = () => dummy ? { gap: dummy.x - wx, hp: dummy.hp, ko: dummy.ko, kos, hits: { n: hits.n, dmg: hits.dmg, seq: hits.seq }, rx: dummy.rx, mode: dummy.mode, ai: dummy.ai, cap: dummy.cap ? { mode: dummy.cap.mode, r: dummy.cap.r, y: dummy.cap.py, rot: dummy.cap.rot, front: dummy.cap.front } : null, stun: Math.max(0, dummy.stunUntil - performance.now()), smoke: smoke.length } : null;
window.__hit = k => gojoHit(k, performance.now());           // test hook: the attacker's swing k lands on Gojo right now (a dash dodges it)
window.__state = () => ({ stance, jumpC, mode, wx, stick: { x: stickX, y: stickY, up: stickUp, down: stickDown, held: stickCr }, lapse: lpAt >= 0 ? lpK : -1, dash: dgAt >= 0 ? dgK : -1, dashAir: dgAir, block: blkAt >= 0 ? (blkEnd < 0 ? 1 : 2) : 0, guard: guardUp(performance.now()), mb: mbAt >= 0, orb: !!orb, debris: debris.length });   // read-only view for the tests
window.__back = () => {                       // Android back button: step back through the menus, otherwise let the app close
  if (settingsOn()) { closeSettings(); return true; }
  if (state === 'play') { show('select'); return true; }
  if (state === 'select') { show('title'); return true; }
  return false;
};

resize();
planBlink(performance.now(), 1200);
last = performance.now();
requestAnimationFrame(tick);
})();
</script>
