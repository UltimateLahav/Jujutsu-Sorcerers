<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0a17">
<title>Jujutsu Sorcerers</title>
<style>
/* Press Start 2P, SIL Open Font License 1.1, embedded so the game works offline */
@font-face{font-family:"Press Start 2P";src:url(data:font/woff2;base64,__FONT__) format("woff2");font-display:block}
:root{--bg:#0d0a17;--ink:#f4f2f8;--dim:#8f86b0;--acc:#8f7ac4;--card:#1a1330;--line:#6d56a0;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;font-family:"Press Start 2P",ui-monospace,monospace}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#game{position:fixed;left:0;top:0;display:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);text-align:center;background:radial-gradient(ellipse at 50% 30%,#2a1a4d,var(--bg) 70%)}
.screen.on{display:flex}
h1{margin:0;font-size:clamp(14px,8vh,44px);line-height:1.3;text-shadow:0 0 14px var(--acc),3px 3px 0 #000}
h2{margin:0;font-size:clamp(10px,4vh,22px);text-shadow:3px 3px 0 #000}
small{color:var(--dim);font-size:clamp(7px,2vh,11px)}
button{font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);padding:1.6vh 2.4vh;cursor:pointer;font-size:clamp(9px,3vh,16px);box-shadow:4px 4px 0 #000}
button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
#title{flex-direction:row;gap:6vh}
.tcol{display:flex;flex-direction:column;align-items:center;gap:3vh}
#hero{width:min(68vh,40vw);height:auto;aspect-ratio:1;filter:drop-shadow(0 0 2vh rgba(90,180,255,.55));animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 4.5vh rgba(120,200,255,.95))}}
.blink{animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:.4}}
.cards{display:flex;gap:2.5vh}
.card{width:24vh;height:40vh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:1.5vh;font-size:clamp(8px,2.4vh,13px)}
.card canvas{height:24vh;width:auto}
.card i{color:var(--dim);font-style:normal;font-size:.8em}
#gojo{border-color:var(--acc)}
#gojo:hover,#gojo:focus-visible{background:#2a1f4a;outline:none}
.lock{opacity:.45;border:3px dashed var(--line);background:#120d22}
.lock span{font-size:8vh;margin-top:6vh}
#hud{position:fixed;left:calc(env(safe-area-inset-left) + 10px);top:calc(env(safe-area-inset-top) + 10px);display:none;align-items:center;gap:12px;font-size:clamp(8px,2.6vh,13px);text-shadow:2px 2px 0 #000}
#hud button{padding:1vh 1.6vh;font-size:inherit}
#pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 calc(env(safe-area-inset-right) + 3vh) calc(env(safe-area-inset-bottom) + 3vh) calc(env(safe-area-inset-left) + 3vh);pointer-events:none}
.grp{display:flex;gap:2vh}
.pb{pointer-events:auto;touch-action:none;width:21vh;height:21vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;padding:0;font-size:clamp(14px,7vh,34px);opacity:.78}
.pb span{font-size:clamp(6px,2vh,10px);color:var(--dim)}
.pb.on{background:#2a1f4a;border-color:var(--acc);opacity:1}
.col{display:flex;flex-direction:column;gap:2vh}
#atk{border-color:#6fb4ff}
#atk svg{width:6vh;height:6vh}
#settings.screen{z-index:5;background:rgba(13,10,23,.95);gap:2vh}
#vols{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 5vh;width:min(92vw,820px);text-align:left}
#vols label{display:grid;grid-template-columns:1fr auto;gap:.8vh 1vh;font-size:clamp(7px,2.2vh,12px)}
#vols input{grid-column:1/3;width:100%;height:3.4vh;accent-color:var(--acc)}
#vols b{font-weight:normal;color:var(--acc)}
.row{display:flex;gap:2.4vh}
#up{border-color:var(--acc)}
#up i{font-style:normal;display:block;transform:rotate(-90deg)}      /* the same chunky chevron as BACK / FWD, turned to point up */
#rotate{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);text-align:center;line-height:1.6;font-size:12px}
#rotate div{font-size:56px;animation:r 2s ease-in-out infinite}
@keyframes r{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<section id="title" class="screen on">
  <canvas id="hero" width="64" height="64" role="img" aria-label="Gojo lifting his blindfold, one eye glowing"></canvas>
  <div class="tcol">
    <h1>JUJUTSU<br>SORCERERS</h1>
    <button id="start" class="blink">TAP TO START</button>
    <small>BEST PLAYED IN LANDSCAPE</small>
  </div>
</section>

<section id="select" class="screen">
  <h2>CHOOSE YOUR SORCERER</h2>
  <div class="cards">
    <button id="gojo" class="card"><canvas id="pv"></canvas><b>GOJO</b><i>STRONGEST</i></button>
    <div class="card lock"><span>?</span><b>LOCKED</b></div>
    <div class="card lock"><span>?</span><b>LOCKED</b></div>
  </div>
</section>

<section id="settings" class="screen">
  <h2>SETTINGS</h2>
  <small>VOLUME OF EACH SOUND (100% = DEFAULT, UP TO 200%)</small>
  <div id="vols"></div>
  <div class="row"><button id="dummyBtn">SPAWN DUMMY</button><button id="setClose">CLOSE</button></div>
</section>

<div id="hud"><button id="back">&lt; MENU</button><span>GOJO SATORU</span><button id="snd">SND ON</button><button id="setBtn">SET</button></div>
<div id="pad">
  <div class="grp">
    <button id="bk" class="pb" aria-label="Walk backward">&lt;<span>BACK</span></button>
    <button id="fw" class="pb" aria-label="Walk forward">&gt;<span>FWD</span></button>
  </div>
  <div class="col">
    <button id="atk" class="pb" aria-label="Attack"><svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M3 0h2v8H3zM0 3h8v2H0zM1 1h1v1H1zM6 1h1v1H6zM1 6h1v1H1zM6 6h1v1H6z"/></svg><span id="atkl">R.HOOK</span></button>
    <button id="up" class="pb" aria-label="Jump"><i>&gt;</i><span>JUMP</span></button>
  </div>
</div>
<div id="rotate"><div>&#128241;</div>ROTATE YOUR PHONE<br>TO LANDSCAPE</div>

<script>
(() => {
'use strict';
__SFX__
const D = __SPR__;                 // palette + idle / walk-forward / walk-back / jump / double-jump (teleport) sprite frames (rows of palette letters)
const HEROES = __HEROES__;         // title key art: 0 eye open ... 4 eye fully closed
const IDLE_FPS = 12, WALK_FPS = 15, JUMP_FPS = 15, TELE_FPS = 20;   // animation speeds in frames per second (15 walk frames = 1 s per cycle = one step every half second; 15 jump frames = 1 s; 15 teleport frames = 0.75 s)
const ATK_FPS = [30, 30, 30, 24], ATK_IMPACT = [7, 7, 7, 8], ATK_SWING = [4, 4, 4, 5], COMBO_MS = 1400;   // 15 frames per attack; the next press within COMBO_MS continues the combo
const ATK_NAMES = ['R.HOOK', 'L.HOOK', 'ELBOW', 'KICK'];
const REACH = [17, 17, 15, 26], KNOCK = [26, 26, 34, 80], DMG = [12, 14, 18, 35];   // per hit: how far it reaches from his hips (px), how hard it shoves the dummy (px/s), damage number
const FWD_SPEED = 44, BACK_SPEED = 30;         // world pixels per second (matched to the slower stride so his feet do not skate)
const BLINK_STEP = 70, BLINK_HOLD = 500;       // ms per blink frame, ms the eye stays shut
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const pv = $('pv'), pctx = pv.getContext('2d');
const hero = $('hero'), hctx = hero.getContext('2d');

// turn a sprite set's text rows into tiny offscreen canvases
const mk = (set, pal = D.pal) => set.frames.map(rows => {
  const c = document.createElement('canvas'); c.width = set.w; c.height = set.h;
  const g = c.getContext('2d');
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const ch = row[x];
      if (ch !== '.') { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); }
    }
  });
  return c;
});
const idleF = mk(D.idle), fwdF = mk(D.fwd), backF = mk(D.back), jumpF = mk(D.jump), teleF = mk(D.tele), atkF = [0, 1, 2, 3].map(k => mk(D['atk' + k]));
const inv = h => '#' + [1, 3, 5].map(i => (255 - parseInt(h.substr(i, 2), 16)).toString(16).padStart(2, '0')).join('');
const invPal = {}, whitePal = {};
for (const k in D.pal) { invPal[k] = inv(D.pal[k]); whitePal[k] = '#ffffff'; }
const dumF = mk(D.idle, invPal), dumW = mk(D.idle, whitePal);      // the training dummy: Gojo with inverted colours
pv.width = D.idle.w; pv.height = D.idle.h;
const heroImgs = HEROES.map(src => { const im = new Image(); im.src = src; return im; });

let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

let state = 'title', S = 1, VW = 320, VH = 128, gy = 100, bg = null, far = null, near = null;
let spawnAt = 0, last = 0, parts = [], wx = 0, mode = 'idle', modeAt = 0, stepN = -1, evJ = -1, evT = -1;
let keyL = false, keyR = false, padL = false, padR = false, jumpReq = false, jumpAt = -1, teleAt = -1, teleL0 = 0, atkReq = false, atkAt = -1, atkK = 0, combo = 0, comboUntil = 0, atkQ = false, evA = -1, lastCombo = -1, shakeUntil = 0, shakeAmp = 0, dummy = null, popups = [];
const STRIP = 480;

// ---------------------------------------------------------------- sound (all synthesised in sfx.js, no audio files)
let sfx = null, soundOn = true;
try { soundOn = localStorage.getItem('js_snd') !== '0'; } catch (e) { /* storage blocked: stay on */ }
function audio() {                            // browsers only allow sound after a tap, so this is first called from the TAP TO START button
  if (!sfx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { sfx = makeSfx(new AC()); } catch (e) { sfx = null; return null; }
    sfx.setOn(soundOn); applyVols();
    if (state === 'play') sfx.windOn();
  }
  if (sfx.ac.state === 'suspended' && !document.hidden) sfx.ac.resume();
  return sfx;
}
function snd(name, a, b) {                    // play one cue (and log it when a test harness asks for that)
  if (window.__sfxlog) window.__sfxlog.push([name, Math.round(performance.now()), a, b]);
  if (sfx && soundOn && sfx.ac.state === 'running') sfx[name](a, b);
}
window.__audio = on => { if (!sfx) return; if (on) audio(); else sfx.ac.suspend(); };   // called by the Android app when it goes to / comes back from the background

// ---------------------------------------------------------------- settings: a volume slider for every sound
const VOLS = [['master', 'MASTER'], ['steps', 'FOOTSTEPS'], ['wind', 'WIND'], ['jump', 'JUMP + LANDING'], ['tele', 'TELEPORT'], ['atk', 'ATTACKS']];
const vol = { master: 100, steps: 100, wind: 100, jump: 100, tele: 100, atk: 100 };
try { Object.assign(vol, JSON.parse(localStorage.getItem('js_vol') || '{}')); } catch (e) { /* storage blocked: defaults */ }
function applyVols() { if (sfx) for (const [k] of VOLS) sfx.setVol(k, vol[k] / 100); }
function preview(k) {                         // let go of a slider and you hear that sound (the wind is already playing underneath)
  if (!audio() || k === 'wind') return;
  if (k === 'jump') { sfx.jump(); setTimeout(() => sfx.land(1), 380); }
  else if (k === 'tele') { sfx.vanish(); setTimeout(() => sfx.arrive(), 120); }
  else if (k === 'atk') { sfx.swing(0); setTimeout(() => { sfx.hit(0); sfx.smack(0); }, 140); }
  else { sfx.step(0, false); setTimeout(() => sfx.step(1, false), 500); }
}

// ---------------------------------------------------------------- title blink
let heroShown = -1, blinkSeq = [], blinkIdx = 0, blinkAt = 0;
function planBlink(now, openFor) {           // open -> 1 -> 2 -> 3 -> 4 (closed, held) -> 3 -> 2 -> 1 -> open
  blinkSeq = [[0, openFor], [1, BLINK_STEP], [2, BLINK_STEP], [3, BLINK_STEP], [4, BLINK_HOLD], [3, BLINK_STEP], [2, BLINK_STEP], [1, BLINK_STEP]];
  blinkIdx = 0; blinkAt = now;
}
function updateBlink(now) {
  while (now - blinkAt >= blinkSeq[blinkIdx][1]) {
    blinkAt += blinkSeq[blinkIdx][1];
    if (++blinkIdx >= blinkSeq.length) planBlink(blinkAt, 2200 + Math.random() * 2200);
  }
  return blinkSeq[blinkIdx][0];
}
function drawHero(i) {
  if (i === heroShown) return;
  const im = heroImgs[i];
  if (!im.complete || !im.naturalWidth) return;   // not decoded yet, retry next frame
  hctx.clearRect(0, 0, 64, 64); hctx.drawImage(im, 0, 0); heroShown = i;
}

// ---------------------------------------------------------------- screens
function show(s) {
  state = s;
  $('title').classList.toggle('on', s === 'title');
  $('select').classList.toggle('on', s === 'select');
  cv.style.display = s === 'play' ? 'block' : 'none';
  $('hud').style.display = s === 'play' ? 'flex' : 'none';
  $('pad').style.display = s === 'play' ? 'flex' : 'none';
  releaseAll(); $('settings').classList.remove('on');
  if (sfx) { if (s === 'play') sfx.windOn(); else sfx.windOff(); }
  if (s === 'play') { spawnAt = performance.now(); wx = 0; mode = 'idle'; modeAt = spawnAt; jumpAt = teleAt = atkAt = -1; atkQ = false; combo = 0; comboUntil = 0; dummy = null; popups = []; }
  if (s === 'title') planBlink(performance.now(), 1200);
}

// ---------------------------------------------------------------- world
// pixel-perfect sizing: whole device pixels per art pixel, ~128 art pixels tall
function resize() {
  const dpr = window.devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  S = Math.max(1, Math.floor(h * dpr / 128));
  VW = Math.ceil(w * dpr / S); VH = Math.ceil(h * dpr / S);
  cv.width = VW; cv.height = VH;
  cv.style.width = (VW * S / dpr) + 'px'; cv.style.height = (VH * S / dpr) + 'px';
  gy = Math.floor(VH * 0.78);
  buildBg();
  far = buildLayer('#2a1b45', 0.3, 26, 21);
  near = buildLayer('#1a1030', 0.2, 34, 33);
  seed = 3;
  parts = Array.from({ length: 30 }, () => ({ x: rnd() * VW, y: rnd() * gy, l: 3 + ((rnd() * 7) | 0), v: 40 + rnd() * 80 }));
}

function buildBg() {                          // static: sky, stars, moon, ground
  bg = document.createElement('canvas'); bg.width = VW; bg.height = VH;
  const g = bg.getContext('2d');
  const sky = ['#0e0a1f', '#171034', '#22184a', '#33205c', '#4a2a6a', '#6a3a74', '#8f4c78', '#b8647a'];
  const bh = Math.ceil(gy / sky.length);
  sky.forEach((c, i) => { g.fillStyle = c; g.fillRect(0, i * bh, VW, bh + 1); });
  seed = 11;
  for (let i = 0; i < 50; i++) { g.fillStyle = rnd() < 0.3 ? '#ffffff' : '#b9a8ee'; g.fillRect((rnd() * VW) | 0, (rnd() * gy * 0.55) | 0, 1, 1); }
  g.fillStyle = '#e9e4ff';
  const mx = (VW * 0.82) | 0, my = (VH * 0.2) | 0;
  for (let dy = -9; dy <= 9; dy++) for (let dx = -9; dx <= 9; dx++) if (dx * dx + dy * dy <= 81) g.fillRect(mx + dx, my + dy, 1, 1);
  g.fillStyle = '#cfc6f2'; g.fillRect(mx - 4, my - 3, 3, 2); g.fillRect(mx + 2, my + 3, 3, 2);
  g.fillStyle = '#150e26'; g.fillRect(0, gy, VW, VH - gy);
  g.fillStyle = '#3a2a5e'; g.fillRect(0, gy, VW, 2);
  g.fillStyle = '#22183c';
  for (let y = gy + 10; y < VH; y += 10) g.fillRect(0, y, VW, 1);
}

function buildLayer(col, hh, w0, sd) {        // a skyline strip that tiles seamlessly
  const c = document.createElement('canvas'); c.width = STRIP; c.height = gy;
  const g = c.getContext('2d');
  seed = sd;
  let x = 0;
  while (x < STRIP) {
    const w = (w0 * 0.5 + rnd() * w0) | 0, h = (gy * (hh * 0.5 + rnd() * hh)) | 0, wins = [];
    for (let k = 0; k < 4; k++) if (rnd() < 0.35) wins.push([(2 + rnd() * (w - 4)) | 0, (3 + rnd() * Math.max(1, h - 6)) | 0]);
    for (const ox of [0, -STRIP]) {           // second copy wraps buildings that cross the strip edge
      g.fillStyle = col; g.fillRect(x + ox, gy - h, w, h);
      g.fillStyle = '#ffd98a';
      for (const [wx2, wy] of wins) g.fillRect(x + ox + wx2, gy - h + wy, 1, 2);
    }
    x += w + ((rnd() * 4) | 0);
  }
  return c;
}

function layer(c, k) {                        // parallax: far layers move less than the ground
  const off = Math.round((((-wx * k) % STRIP) + STRIP) % STRIP);
  for (let x = off - STRIP; x < VW; x += STRIP) ctx.drawImage(c, x, 0);
}

function spawnDummy(now) { dummy = { x: wx + 32, born: now, vx: 0, hitAt: -9999 }; }
function hitDummy(k, now) {                   // called on the impact frame: a hit lands if the dummy is in front of him and within reach
  if (!dummy || now - dummy.born < 600) return;
  const gap = dummy.x - wx;                   // the dummy's centre relative to Gojo's hips; his body is about 12 px wide
  if (gap - 6 > REACH[k] || gap + 6 < 3) return;
  dummy.hitAt = now; dummy.vx += KNOCK[k]; shakeUntil = now + 110; shakeAmp = k === 3 ? 3 : 2;
  popups.push({ born: now, x: dummy.x, txt: '' + (DMG[k] + ((Math.random() * 5) | 0)), col: k === 3 ? '#ff5a5a' : '#7fc4ff' });
  snd('smack', k);
}
function drawDummy(now, dt) {
  if (!dummy) return;
  dummy.x += dummy.vx * dt; dummy.vx *= Math.exp(-7 * dt);                    // knock-back slide with friction
  const cx = Math.round(VW / 2), sx = Math.round(cx + dummy.x - wx);
  if (sx < -50 || sx > VW + 50) return;
  const t = Math.min(1, (now - dummy.born) / 650), e = 1 - Math.pow(1 - t, 3), hitT = now - dummy.hitAt;
  const fi = Math.floor(now / (1000 / IDLE_FPS)) % dumF.length, w = D.idle.w, h = D.idle.h, hx = D.idle.cx - D.idle.x0, y = gy - 60;
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(sx - 9, gy + 3, 18, 2); ctx.fillRect(sx - 6, gy + 2, 12, 1); ctx.fillRect(sx - 6, gy + 5, 12, 1);
  const src = hitT < 70 ? dumW[fi] : dumF[fi], lean = hitT < 320 ? 5 * Math.sin(Math.PI * hitT / 320) : 0;   // white flash, then leans away for a moment
  ctx.save(); ctx.translate(sx, 0); ctx.scale(-1, 1);                          // he faces Gojo (to the left)
  ctx.beginPath(); ctx.rect(-hx - 2, y + Math.round(h * (1 - e)), w + 4, h); ctx.clip();   // materialises from the feet up
  ctx.globalAlpha = Math.min(1, t * 2);
  for (let r = 0; r < h; r += 2) ctx.drawImage(src, 0, r, w, 2, -hx - Math.round(lean * (1 - r / h)), y + r, w, 2);   // 2px strips: the head leans further than the feet
  ctx.restore();
  if (t < 1) { const R = 4 + t * 36; ctx.fillStyle = 'rgba(255,170,90,' + (1 - t) + ')'; for (let a = 0; a < 40; a++) { const th = a / 40 * 6.2832; ctx.fillRect(Math.round(sx + Math.cos(th) * R), Math.round(y + 60 + Math.sin(th) * R * 0.25), 1, 1); } }
}
function drawPopups(now) {                    // damage numbers float up from the dummy and fade
  popups = popups.filter(p => now - p.born < 800);
  ctx.font = '8px "Press Start 2P"'; ctx.textAlign = 'center';
  for (const p of popups) {
    const k = (now - p.born) / 800, x = Math.round(Math.round(VW / 2) + p.x - wx), y = Math.round(gy - 66 - 16 * Math.sqrt(k));
    ctx.globalAlpha = Math.min(1, 2.2 * (1 - k)); ctx.fillStyle = '#000'; ctx.fillText(p.txt, x + 1, y + 1); ctx.fillStyle = p.col; ctx.fillText(p.txt, x, y);
  }
  ctx.globalAlpha = 1;
}

function drawScene(now, dt) {
  const el = Math.max(0, now - spawnAt), t = Math.min(1, el / 900), e = 1 - Math.pow(1 - t, 3);
  let jf = -1, tf = -1;                       // jump frame 0-14 (0-2 crouch, 3 push-off, 4-11 airborne, 12-14 land) / teleport frame 0-14 (0-6 vanish + arrive, 7-11 fall, 12-14 land)
  if (jumpAt >= 0) {
    jf = Math.floor(Math.max(0, now - jumpAt) * JUMP_FPS / 1000);                // clamp: rAF time can trail performance.now() by a hair
    if (jf >= jumpF.length) { jumpAt = -1; jf = -1; }                            // landed
  }
  if (teleAt >= 0) {
    tf = Math.floor(Math.max(0, now - teleAt) * TELE_FPS / 1000);
    if (tf >= teleF.length) { teleAt = -1; tf = -1; }
  }
  let af = -1;                                // attack frame 0-14 (the combo: right hook, left hook, right elbow, roundhouse kick)
  if (atkAt >= 0) {
    af = Math.floor(Math.max(0, now - atkAt) * ATK_FPS[atkK] / 1000);
    if (af >= 15) {                           // swing finished: chain into the next hit if a press was queued, otherwise open the combo window
      if (atkQ) { atkQ = false; atkK = combo; combo = (atkK + 1) % 4; atkAt = now; af = 0; }
      else { atkAt = -1; af = -1; comboUntil = now + COMBO_MS; }
    }
  }
  if (atkReq) {                               // ground only; a press during a swing is remembered and chained
    atkReq = false;
    if (t >= 1 && jf < 0 && tf < 0) {
      if (af >= 0) atkQ = true;
      else { if (now > comboUntil) combo = 0; atkK = combo; combo = (atkK + 1) % 4; atkAt = now; af = 0; atkQ = false; }
    }
  }
  if (af < 0 && combo !== 0 && now > comboUntil) combo = 0;   // waited too long: back to the first hit
  if (combo !== lastCombo) { lastCombo = combo; $('atkl').textContent = ATK_NAMES[combo]; }
  if (jumpReq) {                              // one press = one action; presses while spawning in, crouching, landing or attacking are ignored
    jumpReq = false;
    if (t >= 1) {
      if (jf < 0 && tf < 0) { if (af < 0) { jumpAt = now; jf = 0; } }                            // from the ground: jump
      else if (tf < 0 && jf >= 4 && jf <= 11) { teleL0 = D.jump.lift[jf]; teleAt = now; tf = 0; jumpAt = -1; jf = -1; }   // again in mid-air: teleport up, then fall
    }
  }
  const steer = t >= 1 && ((jf < 0 && tf < 0 && af < 0) || (jf >= 3 && jf <= 11) || (tf >= 0 && tf <= 11));   // no walking while spawning in, crouching or landing
  const dir = steer ? ((keyR || padR) ? 1 : 0) - ((keyL || padL) ? 1 : 0) : 0;
  const nm = tf >= 0 ? 'tele' : jf >= 0 ? 'jump' : af >= 0 ? 'atk' : dir > 0 ? 'fwd' : dir < 0 ? 'back' : 'idle';
  if (nm !== mode) { mode = nm; modeAt = now; stepN = -1; }
  wx += dir * (dir > 0 ? FWD_SPEED : BACK_SPEED) * dt;

  ctx.save();
  if (now < shakeUntil) ctx.translate(Math.round((Math.random() * 2 - 1) * shakeAmp), Math.round((Math.random() * 2 - 1) * shakeAmp));   // tiny shake on impact
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(bg, 0, 0);
  layer(far, 0.25); layer(near, 0.55);
  ctx.fillStyle = '#22183c';                  // ground tile seams scroll with the world
  for (let r = 0, y = gy + 2; y < VH; r++, y += 10) {
    const o = (((-wx % 28) + 28) % 28) + (r % 2) * 14;
    for (let x = o - 28; x < VW; x += 28) ctx.fillRect(Math.round(x), y, 1, 10);
  }
  ctx.fillStyle = 'rgba(220,210,255,0.35)';   // wind streaks
  for (const p of parts) {                    // headwind: blows right-to-left, faster when he walks into it
    p.x -= (p.v + dir * 45) * dt;
    if (p.x < -p.l) p.x = VW; else if (p.x > VW) p.x = -p.l;
    ctx.fillRect(p.x | 0, p.y | 0, p.l, 1);
  }

  if (mode === 'fwd' || mode === 'back') {   // sound cues are locked to the animation: a foot lands at frame 0 and again half a cycle later = one step every half cycle
    const st = Math.floor(Math.max(0, now - modeAt) / (fwdF.length * 500 / WALK_FPS));
    if (st !== stepN) { stepN = st; snd('step', st & 1, mode === 'back'); }
    if (sfx) sfx.windPush(mode === 'fwd' ? 1.3 : 1);
  } else { stepN = -1; if (sfx) sfx.windPush(1); }
  if (jf !== evJ) { if (evJ < 3 && jf >= 3) snd('jump'); if (evJ < 12 && jf >= 12) snd('land', 1); evJ = jf; }
  if (tf !== evT) {
    if (evT < 0 && tf >= 0) snd('charge'); if (evT < 2 && tf >= 2) snd('vanish'); if (evT < 3 && tf >= 3) snd('arrive');
    if (evT < 8 && tf >= 8) snd('fall'); if (evT < 12 && tf >= 12) snd('land', 1.6); evT = tf;
  }
  if (af !== evA) {                           // swing whoosh and impact are locked to their animation frames
    if (af < evA) evA = -1;                   // a chained hit restarted the counter
    if (af >= 0) {
      if (evA < ATK_SWING[atkK] && af >= ATK_SWING[atkK]) snd('swing', atkK);
      if (evA < ATK_IMPACT[atkK] && af >= ATK_IMPACT[atkK]) { snd('hit', atkK); shakeUntil = now + 90; shakeAmp = atkK === 3 ? 2 : 1; hitDummy(atkK, now); }
    }
    evA = af;
  }
  drawDummy(now, dt);                         // behind Gojo, so his fists and kicks overlap it
  const tele = tf >= 0, jumping = jf >= 0, atkOn = af >= 0, idle = mode === 'idle';
  const set = tele ? teleF : jumping ? jumpF : atkOn ? atkF[atkK] : idle ? idleF : mode === 'fwd' ? fwdF : backF;
  const info = tele ? D.tele : jumping ? D.jump : atkOn ? D['atk' + atkK] : idle ? D.idle : mode === 'fwd' ? D.fwd : D.back;
  const fi = tele ? tf : jumping ? jf : atkOn ? af : Math.floor(Math.max(0, now - (idle ? spawnAt : modeAt)) / (1000 / (idle ? IDLE_FPS : WALK_FPS))) % set.length;   // clamp: rAF time can trail performance.now() by a hair
  const lk = tele ? info.lift_k[tf] : 0;      // teleport: stays where he vanished (null), then the fixed height he reappears at, falling back to the ground
  const lift = tele ? (lk === null ? teleL0 : Math.round(Math.min(34, gy - 66) * lk)) : jumping ? info.lift[jf] : 0;   // how far the sprite is raised off the ground
  const cx = Math.round(VW / 2), x = cx - (info.cx - info.x0), y = gy - 60 - info.top - lift;

  const sw = Math.max(5, Math.round(9 * (1 - lift / 48))), sv = Math.round(sw * 2 / 3);   // ground shadow stays put and shrinks while he is in the air
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(cx - sw, gy + 3, sw * 2, 2); ctx.fillRect(cx - sv, gy + 2, sv * 2, 1); ctx.fillRect(cx - sv, gy + 5, sv * 2, 1);

  const ry = Math.round(info.h * (1 - e));    // spawn: materialise from the feet up
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y + ry, info.w, info.h - ry); ctx.clip();
  ctx.globalAlpha = Math.min(1, t * 2);
  ctx.drawImage(set[fi], x, y);
  ctx.restore();

  if (tele && (tf === 2 || tf === 3)) { ctx.fillStyle = 'rgba(160,220,255,0.12)'; ctx.fillRect(0, 0, VW, VH); }   // soft blue flash on the teleport
  if (t < 1) {                                // spawn ring + flash
    const R = 6 + t * 70;
    ctx.fillStyle = 'rgba(120,170,255,' + (1 - t) + ')';
    for (let a = 0; a < 64; a++) {
      const th = a / 64 * 6.2832;
      ctx.fillRect(Math.round(cx + Math.cos(th) * R), Math.round(y + 34 + Math.sin(th) * R * 0.45), 1, 1);
    }
    ctx.fillStyle = 'rgba(255,255,255,' + Math.max(0, 0.55 - t * 1.8) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }
  drawPopups(now);
  ctx.restore();
}

function tick(now) {
  requestAnimationFrame(tick);                // schedule first so one bad frame can't stop the loop
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (state === 'play') drawScene(now, dt);
  else if (state === 'select') {
    pctx.clearRect(0, 0, pv.width, pv.height);
    pctx.drawImage(idleF[Math.floor(now / (1000 / IDLE_FPS)) % idleF.length], 0, 0);
  } else if (state === 'title') drawHero(updateBlink(now));
}

// ---------------------------------------------------------------- input
function releaseAll() {
  keyL = keyR = padL = padR = jumpReq = atkReq = false;
  $('bk').classList.remove('on'); $('fw').classList.remove('on'); $('up').classList.remove('on'); $('atk').classList.remove('on');
}
function bindPad(id, set) {                   // hold-to-walk touch buttons (multi-touch safe)
  const b = $(id);
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { b.setPointerCapture(e.pointerId); } catch (err) { /* older WebViews */ }
    set(true); b.classList.add('on');
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => b.addEventListener(t, () => { set(false); b.classList.remove('on'); }));
  b.addEventListener('contextmenu', e => e.preventDefault());
}
bindPad('bk', v => { padL = v; });
bindPad('fw', v => { padR = v; });
bindPad('up', v => { if (v) jumpReq = true; });           // tap to jump
bindPad('atk', v => { if (v) atkReq = true; });          // tap to attack (each tap is the next hit of the combo)

const KEYS = { ArrowLeft: 'L', KeyA: 'L', ArrowRight: 'R', KeyD: 'R', ArrowUp: 'U', KeyW: 'U', Space: 'U', KeyJ: 'A', KeyF: 'A' };
addEventListener('keydown', e => {
  if (settingsOn()) { if (e.key === 'Escape') closeSettings(); return; }      // the settings screen takes the keyboard while it is open
  const k = KEYS[e.code];
  if (k) {
    if (k === 'L') keyL = true; else if (k === 'R') keyR = true; else if (state === 'play' && !e.repeat) { if (k === 'A') atkReq = true; else jumpReq = true; }
    if (state === 'play') e.preventDefault();
    return;
  }
  if (e.key !== 'Escape') return;
  if (state === 'play') show('select'); else if (state === 'select') show('title');
});
addEventListener('keyup', e => {
  const k = KEYS[e.code];
  if (k === 'L') keyL = false; else if (k === 'R') keyR = false;
});
addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) { releaseAll(); if (sfx) sfx.ac.suspend(); } else if (sfx) audio(); });
['pointerdown', 'keydown'].forEach(e => addEventListener(e, audio, true));   // any first tap or key also unlocks sound

function goFullscreen() {                     // best effort; ignored where unsupported (e.g. iPhone)
  try {
    const el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (f) { const p = f.call(el); if (p && p.catch) p.catch(() => {}); }
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
  } catch (e) { /* not available */ }
}
const inApp = /; wv\)/.test(navigator.userAgent);   // inside the Android app the activity already handles fullscreen + landscape
$('start').addEventListener('click', () => { audio(); if (!inApp && matchMedia('(pointer:coarse)').matches) goFullscreen(); show('select'); });
$('gojo').addEventListener('click', () => show('play'));
$('back').addEventListener('click', () => show('select'));
VOLS.forEach(([k, name]) => {
  const row = document.createElement('label');
  row.innerHTML = '<span>' + name + '</span><b></b><input type="range" min="0" max="200" step="5" aria-label="' + name + ' volume">';
  const inp = row.querySelector('input'), val = row.querySelector('b'); inp.value = vol[k]; val.textContent = vol[k] + '%';
  inp.addEventListener('input', () => {
    vol[k] = +inp.value; val.textContent = vol[k] + '%'; if (sfx) sfx.setVol(k, vol[k] / 100);
    if (window.__sfxlog) window.__sfxlog.push(['vol', Math.round(performance.now()), k, vol[k]]);
  });
  inp.addEventListener('change', () => { try { localStorage.setItem('js_vol', JSON.stringify(vol)); } catch (e) { /* storage blocked */ } preview(k); });
  $('vols').appendChild(row);
});
const settingsOn = () => $('settings').classList.contains('on');
const closeSettings = () => $('settings').classList.remove('on');
$('setBtn').addEventListener('click', () => { releaseAll(); audio(); $('dummyBtn').textContent = dummy ? 'REMOVE DUMMY' : 'SPAWN DUMMY'; $('settings').classList.add('on'); });
$('setClose').addEventListener('click', closeSettings);
$('dummyBtn').addEventListener('click', () => { if (dummy) dummy = null; else spawnDummy(performance.now()); closeSettings(); });
const sndLabel = () => { $('snd').textContent = soundOn ? 'SND ON' : 'SND OFF'; };
sndLabel();
$('snd').addEventListener('click', () => {    // mute / unmute (remembered)
  soundOn = !soundOn; audio(); if (sfx) sfx.setOn(soundOn);
  try { localStorage.setItem('js_snd', soundOn ? '1' : '0'); } catch (e) { /* storage blocked */ }
  sndLabel();
});
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 250));

window.__back = () => {                       // Android back button: step back through the menus, otherwise let the app close
  if (settingsOn()) { closeSettings(); return true; }
  if (state === 'play') { show('select'); return true; }
  if (state === 'select') { show('title'); return true; }
  return false;
};

resize();
planBlink(performance.now(), 1200);
last = performance.now();
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
