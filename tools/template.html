<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0a17">
<title>Jujutsu Sorcerers</title>
<style>
/* Press Start 2P, SIL Open Font License 1.1, embedded so the game works offline */
@font-face{font-family:"Press Start 2P";src:url(data:font/woff2;base64,__FONT__) format("woff2");font-display:block}
:root{--bg:#0d0a17;--ink:#f4f2f8;--dim:#8f86b0;--acc:#8f7ac4;--card:#1a1330;--line:#6d56a0;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;font-family:"Press Start 2P",ui-monospace,monospace}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#game{position:fixed;left:0;top:0;display:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);text-align:center;background:radial-gradient(ellipse at 50% 30%,#2a1a4d,var(--bg) 70%)}
.screen.on{display:flex}
h1{margin:0;font-size:clamp(14px,8vh,44px);line-height:1.3;text-shadow:0 0 14px var(--acc),3px 3px 0 #000}
h2{margin:0;font-size:clamp(10px,4vh,22px);text-shadow:3px 3px 0 #000}
small{color:var(--dim);font-size:clamp(7px,2vh,11px)}
button{font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);padding:1.6vh 2.4vh;cursor:pointer;font-size:clamp(9px,3vh,16px);box-shadow:4px 4px 0 #000}
button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
#title{flex-direction:row;gap:6vh}
.tcol{display:flex;flex-direction:column;align-items:center;gap:3vh}
#hero{width:min(68vh,40vw);height:auto;aspect-ratio:1;filter:drop-shadow(0 0 2vh rgba(90,180,255,.55));animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 4.5vh rgba(120,200,255,.95))}}
.blink{animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:.4}}
.cards{display:flex;gap:2.5vh}
.card{width:24vh;height:40vh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:1.5vh;font-size:clamp(8px,2.4vh,13px)}
.card canvas{height:24vh;width:auto}
.card i{color:var(--dim);font-style:normal;font-size:.8em}
#gojo{border-color:var(--acc)}
#gojo:hover,#gojo:focus-visible{background:#2a1f4a;outline:none}
.lock{opacity:.45;border:3px dashed var(--line);background:#120d22}
.lock span{font-size:8vh;margin-top:6vh}
#hud{position:fixed;left:calc(env(safe-area-inset-left) + 10px);top:calc(env(safe-area-inset-top) + 10px);display:none;align-items:center;gap:12px;font-size:clamp(8px,2.6vh,13px);text-shadow:2px 2px 0 #000}
#hud button{padding:1vh 1.6vh;font-size:inherit}
#pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 calc(env(safe-area-inset-right) + 3vh) calc(env(safe-area-inset-bottom) + 3vh) calc(env(safe-area-inset-left) + 3vh);pointer-events:none}
.pb{pointer-events:auto;touch-action:none;width:21vh;height:21vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;padding:0;font-size:clamp(14px,7vh,34px);opacity:.78}
.pb span{font-size:clamp(6px,2vh,10px);color:var(--dim)}
.pb.on{background:#2a1f4a;border-color:var(--acc);opacity:1}
#rotate{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);text-align:center;line-height:1.6;font-size:12px}
#rotate div{font-size:56px;animation:r 2s ease-in-out infinite}
@keyframes r{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<section id="title" class="screen on">
  <canvas id="hero" width="64" height="64" role="img" aria-label="Gojo lifting his blindfold, one eye glowing"></canvas>
  <div class="tcol">
    <h1>JUJUTSU<br>SORCERERS</h1>
    <button id="start" class="blink">TAP TO START</button>
    <small>BEST PLAYED IN LANDSCAPE</small>
  </div>
</section>

<section id="select" class="screen">
  <h2>CHOOSE YOUR SORCERER</h2>
  <div class="cards">
    <button id="gojo" class="card"><canvas id="pv"></canvas><b>GOJO</b><i>STRONGEST</i></button>
    <div class="card lock"><span>?</span><b>LOCKED</b></div>
    <div class="card lock"><span>?</span><b>LOCKED</b></div>
  </div>
</section>

<div id="hud"><button id="back">&lt; MENU</button><span>GOJO SATORU</span></div>
<div id="pad">
  <button id="bk" class="pb" aria-label="Walk backward">&lt;<span>BACK</span></button>
  <button id="fw" class="pb" aria-label="Walk forward">&gt;<span>FWD</span></button>
</div>
<div id="rotate"><div>&#128241;</div>ROTATE YOUR PHONE<br>TO LANDSCAPE</div>

<script>
(() => {
'use strict';
const D = __SPR__;                 // palette + idle / walk-forward / walk-back sprite frames (rows of palette letters)
const HEROES = __HEROES__;         // title key art: 0 eye open ... 4 eye fully closed
const IDLE_FPS = 12, WALK_FPS = 10;            // animation speeds in frames per second
const FWD_SPEED = 72, BACK_SPEED = 50;         // world pixels per second
const BLINK_STEP = 70, BLINK_HOLD = 500;       // ms per blink frame, ms the eye stays shut
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const pv = $('pv'), pctx = pv.getContext('2d');
const hero = $('hero'), hctx = hero.getContext('2d');

// turn a sprite set's text rows into tiny offscreen canvases
const mk = set => set.frames.map(rows => {
  const c = document.createElement('canvas'); c.width = set.w; c.height = set.h;
  const g = c.getContext('2d');
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const ch = row[x];
      if (ch !== '.') { g.fillStyle = D.pal[ch]; g.fillRect(x, y, 1, 1); }
    }
  });
  return c;
});
const idleF = mk(D.idle), fwdF = mk(D.fwd), backF = mk(D.back);
pv.width = D.idle.w; pv.height = D.idle.h;
const heroImgs = HEROES.map(src => { const im = new Image(); im.src = src; return im; });

let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

let state = 'title', S = 1, VW = 320, VH = 128, gy = 100, bg = null, far = null, near = null;
let spawnAt = 0, last = 0, parts = [], wx = 0, mode = 'idle', modeAt = 0;
let keyL = false, keyR = false, padL = false, padR = false;
const STRIP = 480;

// ---------------------------------------------------------------- title blink
let heroShown = -1, blinkSeq = [], blinkIdx = 0, blinkAt = 0;
function planBlink(now, openFor) {           // open -> 1 -> 2 -> 3 -> 4 (closed, held) -> 3 -> 2 -> 1 -> open
  blinkSeq = [[0, openFor], [1, BLINK_STEP], [2, BLINK_STEP], [3, BLINK_STEP], [4, BLINK_HOLD], [3, BLINK_STEP], [2, BLINK_STEP], [1, BLINK_STEP]];
  blinkIdx = 0; blinkAt = now;
}
function updateBlink(now) {
  while (now - blinkAt >= blinkSeq[blinkIdx][1]) {
    blinkAt += blinkSeq[blinkIdx][1];
    if (++blinkIdx >= blinkSeq.length) planBlink(blinkAt, 2200 + Math.random() * 2200);
  }
  return blinkSeq[blinkIdx][0];
}
function drawHero(i) {
  if (i === heroShown) return;
  const im = heroImgs[i];
  if (!im.complete || !im.naturalWidth) return;   // not decoded yet, retry next frame
  hctx.clearRect(0, 0, 64, 64); hctx.drawImage(im, 0, 0); heroShown = i;
}

// ---------------------------------------------------------------- screens
function show(s) {
  state = s;
  $('title').classList.toggle('on', s === 'title');
  $('select').classList.toggle('on', s === 'select');
  cv.style.display = s === 'play' ? 'block' : 'none';
  $('hud').style.display = s === 'play' ? 'flex' : 'none';
  $('pad').style.display = s === 'play' ? 'flex' : 'none';
  releaseAll();
  if (s === 'play') { spawnAt = performance.now(); wx = 0; mode = 'idle'; modeAt = spawnAt; }
  if (s === 'title') planBlink(performance.now(), 1200);
}

// ---------------------------------------------------------------- world
// pixel-perfect sizing: whole device pixels per art pixel, ~128 art pixels tall
function resize() {
  const dpr = window.devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  S = Math.max(1, Math.floor(h * dpr / 128));
  VW = Math.ceil(w * dpr / S); VH = Math.ceil(h * dpr / S);
  cv.width = VW; cv.height = VH;
  cv.style.width = (VW * S / dpr) + 'px'; cv.style.height = (VH * S / dpr) + 'px';
  gy = Math.floor(VH * 0.78);
  buildBg();
  far = buildLayer('#2a1b45', 0.3, 26, 21);
  near = buildLayer('#1a1030', 0.2, 34, 33);
  seed = 3;
  parts = Array.from({ length: 30 }, () => ({ x: rnd() * VW, y: rnd() * gy, l: 3 + ((rnd() * 7) | 0), v: 40 + rnd() * 80 }));
}

function buildBg() {                          // static: sky, stars, moon, ground
  bg = document.createElement('canvas'); bg.width = VW; bg.height = VH;
  const g = bg.getContext('2d');
  const sky = ['#0e0a1f', '#171034', '#22184a', '#33205c', '#4a2a6a', '#6a3a74', '#8f4c78', '#b8647a'];
  const bh = Math.ceil(gy / sky.length);
  sky.forEach((c, i) => { g.fillStyle = c; g.fillRect(0, i * bh, VW, bh + 1); });
  seed = 11;
  for (let i = 0; i < 50; i++) { g.fillStyle = rnd() < 0.3 ? '#ffffff' : '#b9a8ee'; g.fillRect((rnd() * VW) | 0, (rnd() * gy * 0.55) | 0, 1, 1); }
  g.fillStyle = '#e9e4ff';
  const mx = (VW * 0.82) | 0, my = (VH * 0.2) | 0;
  for (let dy = -9; dy <= 9; dy++) for (let dx = -9; dx <= 9; dx++) if (dx * dx + dy * dy <= 81) g.fillRect(mx + dx, my + dy, 1, 1);
  g.fillStyle = '#cfc6f2'; g.fillRect(mx - 4, my - 3, 3, 2); g.fillRect(mx + 2, my + 3, 3, 2);
  g.fillStyle = '#150e26'; g.fillRect(0, gy, VW, VH - gy);
  g.fillStyle = '#3a2a5e'; g.fillRect(0, gy, VW, 2);
  g.fillStyle = '#22183c';
  for (let y = gy + 10; y < VH; y += 10) g.fillRect(0, y, VW, 1);
}

function buildLayer(col, hh, w0, sd) {        // a skyline strip that tiles seamlessly
  const c = document.createElement('canvas'); c.width = STRIP; c.height = gy;
  const g = c.getContext('2d');
  seed = sd;
  let x = 0;
  while (x < STRIP) {
    const w = (w0 * 0.5 + rnd() * w0) | 0, h = (gy * (hh * 0.5 + rnd() * hh)) | 0, wins = [];
    for (let k = 0; k < 4; k++) if (rnd() < 0.35) wins.push([(2 + rnd() * (w - 4)) | 0, (3 + rnd() * Math.max(1, h - 6)) | 0]);
    for (const ox of [0, -STRIP]) {           // second copy wraps buildings that cross the strip edge
      g.fillStyle = col; g.fillRect(x + ox, gy - h, w, h);
      g.fillStyle = '#ffd98a';
      for (const [wx2, wy] of wins) g.fillRect(x + ox + wx2, gy - h + wy, 1, 2);
    }
    x += w + ((rnd() * 4) | 0);
  }
  return c;
}

function layer(c, k) {                        // parallax: far layers move less than the ground
  const off = Math.round((((-wx * k) % STRIP) + STRIP) % STRIP);
  for (let x = off - STRIP; x < VW; x += STRIP) ctx.drawImage(c, x, 0);
}

function drawScene(now, dt) {
  const el = Math.max(0, now - spawnAt), t = Math.min(1, el / 900), e = 1 - Math.pow(1 - t, 3);
  const dir = t >= 1 ? ((keyR || padR) ? 1 : 0) - ((keyL || padL) ? 1 : 0) : 0;   // no walking while spawning in
  const nm = dir > 0 ? 'fwd' : dir < 0 ? 'back' : 'idle';
  if (nm !== mode) { mode = nm; modeAt = now; }
  wx += dir * (dir > 0 ? FWD_SPEED : BACK_SPEED) * dt;

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(bg, 0, 0);
  layer(far, 0.25); layer(near, 0.55);
  ctx.fillStyle = '#22183c';                  // ground tile seams scroll with the world
  for (let r = 0, y = gy + 2; y < VH; r++, y += 10) {
    const o = (((-wx % 28) + 28) % 28) + (r % 2) * 14;
    for (let x = o - 28; x < VW; x += 28) ctx.fillRect(Math.round(x), y, 1, 10);
  }
  ctx.fillStyle = 'rgba(220,210,255,0.35)';   // wind streaks, blowing to the right
  for (const p of parts) { p.x += p.v * dt; if (p.x > VW) p.x = -p.l; ctx.fillRect(p.x | 0, p.y | 0, p.l, 1); }

  const idle = mode === 'idle', set = idle ? idleF : mode === 'fwd' ? fwdF : backF;
  const info = idle ? D.idle : mode === 'fwd' ? D.fwd : D.back;
  const fi = Math.floor(Math.max(0, now - (idle ? spawnAt : modeAt)) / (1000 / (idle ? IDLE_FPS : WALK_FPS))) % set.length;   // clamp: rAF time can trail performance.now() by a hair
  const cx = Math.round(VW / 2), x = cx - (info.cx - info.x0), y = gy - 60;

  ctx.fillStyle = 'rgba(0,0,0,0.4)';          // ground shadow
  ctx.fillRect(cx - 9, gy + 3, 18, 2); ctx.fillRect(cx - 6, gy + 2, 12, 1); ctx.fillRect(cx - 6, gy + 5, 12, 1);

  const ry = Math.round(info.h * (1 - e));    // spawn: materialise from the feet up
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y + ry, info.w, info.h - ry); ctx.clip();
  ctx.globalAlpha = Math.min(1, t * 2);
  ctx.drawImage(set[fi], x, y);
  ctx.restore();

  if (t < 1) {                                // spawn ring + flash
    const R = 6 + t * 70;
    ctx.fillStyle = 'rgba(120,170,255,' + (1 - t) + ')';
    for (let a = 0; a < 64; a++) {
      const th = a / 64 * 6.2832;
      ctx.fillRect(Math.round(cx + Math.cos(th) * R), Math.round(y + 34 + Math.sin(th) * R * 0.45), 1, 1);
    }
    ctx.fillStyle = 'rgba(255,255,255,' + Math.max(0, 0.55 - t * 1.8) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }
}

function tick(now) {
  requestAnimationFrame(tick);                // schedule first so one bad frame can't stop the loop
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (state === 'play') drawScene(now, dt);
  else if (state === 'select') {
    pctx.clearRect(0, 0, pv.width, pv.height);
    pctx.drawImage(idleF[Math.floor(now / (1000 / IDLE_FPS)) % idleF.length], 0, 0);
  } else if (state === 'title') drawHero(updateBlink(now));
}

// ---------------------------------------------------------------- input
function releaseAll() {
  keyL = keyR = padL = padR = false;
  $('bk').classList.remove('on'); $('fw').classList.remove('on');
}
function bindPad(id, set) {                   // hold-to-walk touch buttons (multi-touch safe)
  const b = $(id);
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { b.setPointerCapture(e.pointerId); } catch (err) { /* older WebViews */ }
    set(true); b.classList.add('on');
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => b.addEventListener(t, () => { set(false); b.classList.remove('on'); }));
  b.addEventListener('contextmenu', e => e.preventDefault());
}
bindPad('bk', v => { padL = v; });
bindPad('fw', v => { padR = v; });

const KEYS = { ArrowLeft: 'L', KeyA: 'L', ArrowRight: 'R', KeyD: 'R' };
addEventListener('keydown', e => {
  const k = KEYS[e.code];
  if (k) { if (k === 'L') keyL = true; else keyR = true; if (state === 'play') e.preventDefault(); return; }
  if (e.key !== 'Escape') return;
  if (state === 'play') show('select'); else if (state === 'select') show('title');
});
addEventListener('keyup', e => {
  const k = KEYS[e.code];
  if (k === 'L') keyL = false; else if (k === 'R') keyR = false;
});
addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });

function goFullscreen() {                     // best effort; ignored where unsupported (e.g. iPhone)
  try {
    const el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (f) { const p = f.call(el); if (p && p.catch) p.catch(() => {}); }
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
  } catch (e) { /* not available */ }
}
const inApp = /; wv\)/.test(navigator.userAgent);   // inside the Android app the activity already handles fullscreen + landscape
$('start').addEventListener('click', () => { if (!inApp && matchMedia('(pointer:coarse)').matches) goFullscreen(); show('select'); });
$('gojo').addEventListener('click', () => show('play'));
$('back').addEventListener('click', () => show('select'));
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 250));

window.__back = () => {                       // Android back button: step back through the menus, otherwise let the app close
  if (state === 'play') { show('select'); return true; }
  if (state === 'select') { show('title'); return true; }
  return false;
};

resize();
planBlink(performance.now(), 1200);
last = performance.now();
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
